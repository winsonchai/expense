name: Android checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, debug build and Android lint
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --stacktrace
      - name: Check packaged permissions
        run: python3 scripts/check_apk_permissions.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
